<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300"><defs><style>.key{animation:k 1.5s ease-in-out infinite}.door{animation:d 2.8s ease-in-out infinite}@keyframes k{50%{transform:scale(1.08);opacity:.5}}@keyframes d{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}</style></defs><rect width="900" height="300" rx="28" fill="#0a101b"/><text x="40" y="45" fill="white" font-family="Arial" font-size="25" font-weight="700">Fonksiyonlu Kapı • Control Pulse</text><text x="40" y="70" fill="#94a3b8" font-family="Arial" font-size="14">Keypad / IR / Bluetooth → command → actuator</text><g transform="translate(90 125)"><rect width="200" height="95" rx="22" fill="#111827" stroke="#334155"/><g class="key"><rect x="72" y="22" width="56" height="45" rx="8" fill="none" stroke="#a78bfa" stroke-width="4"/><text x="100" y="52" text-anchor="middle" fill="white" font-family="Arial" font-size="15">INPUT</text></g></g><g transform="translate(350 125)"><rect width="200" height="95" rx="22" fill="#111827" stroke="#334155"/><text x="100" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="17" font-weight="700">LOGIC</text><text x="100" y="68" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">function / command</text></g><g transform="translate(620 125)"><rect width="180" height="95" rx="22" fill="#111827" stroke="#334155"/><g class="door"><rect x="52" y="22" width="55" height="55" fill="none" stroke="#22c55e" stroke-width="5"/><circle cx="97" cy="50" r="4" fill="#22c55e"/></g><text x="130" y="52" fill="white" font-family="Arial" font-size="14">DOOR</text></g><path d="M290 172H350M550 172H620" stroke="#a78bfa" stroke-width="5"/><circle cx="290" cy="172" r="6" fill="#a78bfa"><animate attributeName="cx" values="290;350;550;620;290" dur="3.8s" repeatCount="indefinite"/></circle></svg>